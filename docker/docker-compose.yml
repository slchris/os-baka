version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: osbaka-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-osbaka}
      POSTGRES_USER: ${POSTGRES_USER:-osbaka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    # Uncomment below to access DB directly from host for debugging:
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U osbaka" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: osbaka-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-osbaka}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-osbaka}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost}
      # FIELD_ENCRYPTION_KEY enables AES-256-GCM encryption of LUKS passphrases
      # and other sensitive node fields at rest. Generate via: openssl rand -hex 32
      # FIELD_ENCRYPTION_KEY: "${FIELD_ENCRYPTION_KEY}"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Frontend (React - New UI)
  frontend:
    image: node:20-alpine
    container_name: osbaka-frontend
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend

volumes:
  postgres_data:
