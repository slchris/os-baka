# OS Baka Unified Configuration

# Server Configuration
server:
  port: "8000"
  mode: "debug" # debug or release
  secret_key: "change-this-in-production"

# Database Configuration
database:
  url: "postgresql://osbaka:password@db:5432/osbaka"
  max_idle_conns: 10
  max_open_conns: 100

# CORS Configuration
cors:
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
    - "http://127.0.0.1:3000"
    - "http://127.0.0.1:5173"

# LUKS passphrase storage: passphrases are AES-256-GCM encrypted at rest in the
# node row using FIELD_ENCRYPTION_KEY (hex-encoded 32 bytes). Set the env var
# in production; without it the passphrase is stored as plaintext.
