name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 0' # Weekly scan

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/os-baka

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: GolangCI-Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6.2
          working-directory: ./backend
          args: --timeout=5m

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: ./backend/...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        working-directory: ./backend
        run: govulncheck ./...

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          exit-code: '0' # Don't block build on mild vulns for now
          severity: 'CRITICAL,HIGH'

  backend:
    needs: security
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Build
      working-directory: ./backend
      run: go build -v ./cmd/server

    - name: Test
      working-directory: ./backend
      run: go test -v ./...

  frontend:
    needs: security
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install Dependencies
      working-directory: ./frontend
      run: npm install

    - name: Build
      working-directory: ./frontend
      run: npm run build

    - name: Test
      working-directory: ./frontend
      run: npm test -- --run

  # Build all three images. On push to main, also push them to GHCR
  # (ghcr.io/<owner>/os-baka-{backend,frontend,pxe-services}). PRs build
  # only — no registry credentials, no push.
  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Backend image
      uses: docker/build-push-action@v6
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: ${{ github.event_name == 'push' }}
        tags: |
          ${{ env.IMAGE_PREFIX }}-backend:latest
          ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
        cache-from: type=gha,scope=backend
        cache-to: type=gha,scope=backend,mode=max

    - name: Build and push Frontend image
      uses: docker/build-push-action@v6
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        build-args: |
          VITE_API_URL=/api/v1
        push: ${{ github.event_name == 'push' }}
        tags: |
          ${{ env.IMAGE_PREFIX }}-frontend:latest
          ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
        cache-from: type=gha,scope=frontend
        cache-to: type=gha,scope=frontend,mode=max

    - name: Build and push PXE Service image
      uses: docker/build-push-action@v6
      with:
        context: ./pxe-services
        file: ./pxe-services/Dockerfile
        push: ${{ github.event_name == 'push' }}
        tags: |
          ${{ env.IMAGE_PREFIX }}-pxe-services:latest
          ${{ env.IMAGE_PREFIX }}-pxe-services:${{ github.sha }}
        cache-from: type=gha,scope=pxe-services
        cache-to: type=gha,scope=pxe-services,mode=max
